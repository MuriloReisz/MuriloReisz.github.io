name: Deploy to GitHub Pages

# Builds the Astro site and publishes ./dist to GitHub Pages on every push to main.
# One-time setup in the repo: Settings → Pages → Source → "GitHub Actions".
# If the site is served from https://<user>.github.io/<repo>/ rather than a custom
# domain, also set `site` and `base` in astro.config.mjs to match, or the CSS and
# image paths will 404.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer run cancel an in-flight one; never cancel a run that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
