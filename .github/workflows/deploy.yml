name: Deploy to GitHub Pages

# Builds the Astro site and publishes ./dist to GitHub Pages on every push to main.
# One-time setup in the repo: Settings → Pages → Source → "GitHub Actions".
# If the site is served from https://<user>.github.io/<repo>/ rather than a custom
# domain, also set `site` and `base` in astro.config.mjs to match, or the CSS and
# image paths will 404.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer run cancel an in-flight one; never cancel a run that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # npm ci has a documented crash (npm/cli#4028, "Exit handler never
      # called!") that can leave a dependency entirely unextracted while
      # still exiting 0. npm install doesn't share that code path, so use
      # it instead — trading strict lockfile enforcement for actually
      # finishing the install, which matters more for a solo deploy.
      - name: Install dependencies
        run: |
          set -o pipefail
          pwd
          cat package.json
          npm install 2>&1 | tee /tmp/install.log
      - name: Diagnose environment
        if: always()
        run: |
          echo "::notice title=versions::node $(node -v) / npm $(npm -v)"
          tail -n 40 /tmp/install.log 2>&1 | sed 's/^/::notice title=install-log::/'
          ls -la node_modules 2>&1 | head -20 | sed 's/^/::notice title=nm-ls::/'
      - run: node node_modules/astro/astro.js build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
