<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Voxer voice and text thread"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1c1e"/><stop offset="1" stop-color="#0a0a0c"/></linearGradient></defs><rect width="1600" height="1000" fill="url(#bg)"/><rect x="0" y="0" width="1600" height="58" fill="#141416"/><line x1="0" y1="58" x2="1600" y2="58" stroke="#333335"/><circle cx="34" cy="29" r="7" fill="#3a3a3d"/><circle cx="58" cy="29" r="7" fill="#3a3a3d"/><circle cx="82" cy="29" r="7" fill="#3a3a3d"/><text x="80" y="140" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#f2f2f4">Voxer · Ardmore Timber</text><rect x="80" y="200" width="620" height="78" rx="16" fill="#242426" stroke="#333335"/><circle cx="126" cy="239" r="20" fill="rgba(255,255,255,0.18)"/><path d="M120 231 L120 247 M126 227 L126 251 M132 233 L132 245" stroke="#f2f2f4" stroke-width="3" stroke-linecap="round"/><text x="160" y="245" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="15" fill="#f2f2f4">Quick one — can the reminder also fire for overdue invoices, not just new ones?</text><text x="680" y="264" text-anchor="end" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8f">0:18</text><text x="80" y="294" text-anchor="start" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8f">09:12</text><rect x="900" y="312" width="620" height="78" rx="16" fill="#6d5ef0" stroke="none"/><circle cx="946" cy="351" r="20" fill="rgba(255,255,255,0.18)"/><path d="M940 343 L940 359 M946 339 L946 363 M952 345 L952 357" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/><text x="980" y="357" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff">Yep — adding a second trigger, live by this afternoon.</text><text x="1500" y="376" text-anchor="end" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.7)">0:09</text><text x="1520" y="406" text-anchor="end" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8f">09:15</text><rect x="80" y="424" width="620" height="56" rx="16" fill="#242426" stroke="#333335"/><text x="102" y="458" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="15" fill="#f2f2f4">Perfect, that was the annoying one.</text><text x="80" y="496" text-anchor="start" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8f">09:16</text><rect x="900" y="514" width="620" height="78" rx="16" fill="#6d5ef0" stroke="none"/><circle cx="946" cy="553" r="20" fill="rgba(255,255,255,0.18)"/><path d="M940 545 L940 561 M946 541 L946 565 M952 547 L952 559" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/><text x="980" y="559" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff">Shipped. Test it on the Kilcoole account when you get a chance.</text><text x="1500" y="578" text-anchor="end" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.7)">0:12</text><text x="1520" y="608" text-anchor="end" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8f">11:40</text></svg>