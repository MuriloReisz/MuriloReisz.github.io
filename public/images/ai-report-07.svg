<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800"><rect width="1400" height="800" fill="#ffffff"/><text x="70" y="86" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#6d5ef0">YOUR 4-DAY QUICK-START PLAN</text><text x="70" y="138" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="-1" fill="#1d1d1f">One small action a day</text><line x1="116" y1="160" x2="116" y2="730" stroke="#e0e0e0" stroke-width="2"/><circle cx="116" cy="180" r="13" fill="#6d5ef0"/><text x="116" y="185" text-anchor="middle" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">1</text><text x="156" y="168" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#6d5ef0">DAY 1</text><text x="156" y="196" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1d1d1f">Turn on the phone attendant</text><text x="156" y="224" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="15.5" fill="#6b6b6b">Connect your existing number — nothing to migrate.</text><circle cx="116" cy="320" r="13" fill="#6d5ef0"/><text x="116" y="325" text-anchor="middle" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">2</text><text x="156" y="308" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#6d5ef0">DAY 2</text><text x="156" y="336" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1d1d1f">Wire the inbox to your CRM</text><text x="156" y="364" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="15.5" fill="#6b6b6b">Every new enquiry logs itself from this point on.</text><circle cx="116" cy="460" r="13" fill="#6d5ef0"/><text x="116" y="465" text-anchor="middle" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">3</text><text x="156" y="448" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#6d5ef0">DAY 3</text><text x="156" y="476" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1d1d1f">Point the dashboard at your data</text><text x="156" y="504" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="15.5" fill="#6b6b6b">Monday’s report starts building itself overnight.</text><circle cx="116" cy="600" r="13" fill="#6d5ef0"/><text x="116" y="605" text-anchor="middle" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">4</text><text x="156" y="588" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#6d5ef0">DAY 4</text><text x="156" y="616" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1d1d1f">Review the first automated week</text><text x="156" y="644" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="15.5" fill="#6b6b6b">Fifteen minutes to confirm it caught everything.</text><g opacity="1"><circle cx="52" cy="760" r="4" fill="#6d5ef0"/><text x="66" y="764" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#6b6b6b">Murilo Reis &#183; AI Tools Assessment</text><text x="1348" y="764" text-anchor="end" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#6b6b6b">7 / 9</text></g></svg>