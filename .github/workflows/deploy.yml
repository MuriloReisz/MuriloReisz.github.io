name: Deploy to GitHub Pages

# Builds the Astro site and publishes ./dist to GitHub Pages on every push to main.
# One-time setup in the repo: Settings → Pages → Source → "GitHub Actions".
# If the site is served from https://<user>.github.io/<repo>/ rather than a custom
# domain, also set `site` and `base` in astro.config.mjs to match, or the CSS and
# image paths will 404.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer run cancel an in-flight one; never cancel a run that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 20's bundled npm (10.8.2 on this runner image)
          # deterministically hits npm/cli#4028 ("Exit handler never
          # called!") on this project — it exits 0 while leaving a
          # dependency unextracted. Node 22 ships a newer npm with that
          # fixed, and Astro 4's engines field allows anything >=21.
          node-version: 22
      # Single attempt this round — we need npm's own debug log, not just
      # stdout, to see what it was actually doing when it crashed.
      - name: Install dependencies
        run: npm install --loglevel verbose 2>&1 | tee /tmp/install.log
        continue-on-error: true
      - name: Diagnose environment
        if: always()
        run: |
          echo "::notice title=versions::node $(node -v) / npm $(npm -v)"
          echo "::notice title=astro-file::$([ -f node_modules/astro/astro.js ] && echo present || echo MISSING)"
          tail -n 60 /tmp/install.log | sed 's/^/::notice title=install-tail::/'
          debuglog=$(ls -t /home/runner/.npm/_logs/*-debug-0.log 2>/dev/null | head -1)
          if [ -n "$debuglog" ]; then
            tail -n 80 "$debuglog" | sed 's/^/::notice title=npm-debug::/'
          fi
      - run: node node_modules/astro/astro.js build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
