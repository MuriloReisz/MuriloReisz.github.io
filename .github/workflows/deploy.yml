name: Deploy to GitHub Pages

# Builds the Astro site and publishes ./dist to GitHub Pages on every push to main.
# One-time setup in the repo: Settings → Pages → Source → "GitHub Actions".
# If the site is served from https://<user>.github.io/<repo>/ rather than a custom
# domain, also set `site` and `base` in astro.config.mjs to match, or the CSS and
# image paths will 404.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer run cancel an in-flight one; never cancel a run that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # npm ci can hit "Exit handler never called!" (npm/cli#4028) and still
      # exit 0 despite an incomplete install, so `npm ci || npm ci` never
      # retries when it matters. Check for the actual binary instead.
      - name: Install dependencies
        run: |
          npm ci
          if [ ! -x node_modules/.bin/astro ]; then
            echo "astro binary missing after npm ci — reinstalling"
            rm -rf node_modules
            npm ci
          fi
      # Emitted as ::notice:: so the output is readable from the Checks API
      # (annotations) even without a signed-in browser session on the logs.
      - name: Diagnose environment
        if: always()
        run: |
          echo "::notice title=versions::node $(node -v) / npm $(npm -v)"
          ls -la node_modules/.bin/astro 2>&1 | sed 's/^/::notice title=bin-ls::/'
          node node_modules/astro/astro.js --version 2>&1 | sed 's/^/::notice title=astro-version::/'
      - run: node node_modules/astro/astro.js build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
