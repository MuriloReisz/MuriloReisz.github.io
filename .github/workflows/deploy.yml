name: Deploy to GitHub Pages

# Builds the Astro site and publishes ./dist to GitHub Pages on every push to main.
# One-time setup in the repo: Settings → Pages → Source → "GitHub Actions".
# If the site is served from https://<user>.github.io/<repo>/ rather than a custom
# domain, also set `site` and `base` in astro.config.mjs to match, or the CSS and
# image paths will 404.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer run cancel an in-flight one; never cancel a run that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 20's bundled npm (10.8.2 on this runner image)
          # deterministically hits npm/cli#4028 ("Exit handler never
          # called!") on this project — it exits 0 while leaving a
          # dependency unextracted. Node 22 ships a newer npm with that
          # fixed, and Astro 4's engines field allows anything >=21.
          node-version: 22
      # Verify against the real symptom (module missing), not npm's exit
      # code, and retry a few times as a backstop in case it recurs.
      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm install
            if [ -f node_modules/astro/astro.js ]; then
              echo "astro installed on attempt $i"
              exit 0
            fi
            echo "astro missing after attempt $i — retrying"
            rm -rf node_modules
          done
          echo "astro still missing after 3 attempts"
          exit 1
      - run: node node_modules/astro/astro.js build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
