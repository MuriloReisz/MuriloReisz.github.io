name: Deploy to GitHub Pages

# Builds the Astro site and publishes ./dist to GitHub Pages on every push to main.
# One-time setup in the repo: Settings → Pages → Source → "GitHub Actions".
# If the site is served from https://<user>.github.io/<repo>/ rather than a custom
# domain, also set `site` and `base` in astro.config.mjs to match, or the CSS and
# image paths will 404.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer run cancel an in-flight one; never cancel a run that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # 22 is the current LTS. Astro 4 wants 18.20+/20.3+/22+, so this is
          # comfortably inside its range.
          node-version: 22
          cache: npm
      - run: npm ci
      # Type-check the 46 .astro/.ts files before building. The checker is
      # installed here with --no-save rather than being a devDependency on
      # purpose: the machine this repo is developed on has npm pointed at an
      # internal registry, so any `npm install` that writes package-lock.json
      # bakes internal URLs into it and `npm ci` above then fails. That has
      # already broken this deploy once. Keeping it off the lockfile keeps the
      # lockfile reproducible from the public registry.
      - name: Type-check
        run: npm run typecheck
      - run: npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
